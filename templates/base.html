<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notes App{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=3">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
</head>
<body>

    <aside class="sidebar">
        <h2>My Knowledge Base</h2>
        <a href="/notes" {% if request.path.startswith('/notes') %}class="active"{% endif %}>📝 Notes</a>
        <a href="/outputs" {% if request.path.startswith('/outputs') %}class="active"{% endif %}>✨ Outputs</a>
        <a href="/notes/search">🔍 Search</a>
        
        {% if session.get('user_id') %}
            <div style="margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border-color);">
                <a href="/logout" style="color: var(--danger);">Log out</a>
            </div>
        {% endif %}
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Modal Container -->
    <div id="global-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" style="margin:0; font-size: 16px; font-weight: 600;">Details</h3>
                <button class="close-btn" onclick="closeModal()" style="background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <script>
        function openModal(title, bodyHtml, footerHtml) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerHtml;
            document.getElementById('global-modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('global-modal').classList.remove('active');
        }
        
        document.getElementById('global-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        async function loadNoteDetails(id) {
            try {
                const res = await fetch(`/notes/${id}?format=json`);
                if (!res.ok) throw new Error("Server returned " + res.status);
                const data = await res.json();
                
                const body = '<div style="white-space: pre-wrap; font-size: 15px; line-height: 1.6;">' + data.content + '</div>';
                
                let footer = '';
                footer += `<form method="post" action="/notes/${data.id}/delete" style="margin-right: auto;">
                    <button type="submit" class="btn" style="background: var(--danger); color: white;">Delete</button>
                </form>`;

                if (data.status === 'under_review') {
                    footer += `<a href="/notes/${data.id}/review" class="btn">Continue Review</a>`;
                }

                openModal(`[${data.type.toUpperCase()}] ${data.status.replace('_', ' ')}`, body, footer);
            } catch (error) {
                alert("ERROR: " + error.message);
            }
        }

        async function loadOutputDetails(id) {
            try {
                const res = await fetch(`/outputs/${id}?format=json`);
                if (!res.ok) throw new Error("Server returned " + res.status);
                const data = await res.json();
                
                const body = '<div style="white-space: pre-line; font-family: serif; line-height: 1.5;">' + data.content + '</div>';
                
                let footer = '';
                footer += `<form method="post" action="/outputs/${data.id}/delete" style="margin-right: auto;">
                    <button type="submit" class="btn" style="background: var(--danger); color: white;">Delete</button>
                </form>`;
                footer += `<form method="post" action="/outputs/${data.id}/regenerate" style="display:inline;">
                    <button type="submit" class="btn">Regenerate</button>
                </form>`;

                openModal(`[${data.type.toUpperCase()}] ${data.topic || 'Untitled'}`, body, footer);
            } catch (error) {
                alert("ERROR: " + error.message);
            }
        }

        // Helper function for note links inside outputs
        window.openNoteFromOutput = function(noteId) {
            loadNoteDetails(noteId);
        };

        // --- New Note Modal ---
        function openNewNoteModal() {
            const body = `
                <form id="new-note-form" onsubmit="submitNewNote(event)">
                    <textarea name="content" placeholder="Write your note..." required 
                        style="width: 100%; min-height: 150px; padding: 12px; font-size: 15px; border: 1px solid var(--border-color); border-radius: 6px; resize: vertical; font-family: inherit;"></textarea>
                </form>
            `;
            const footer = `
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" form="new-note-form" class="btn">Submit Note</button>
            `;
            openModal('New Note', body, footer);
        }

        async function submitNewNote(event) {
            event.preventDefault();
            
            const form = document.getElementById('new-note-form');
            if (!form) {
                alert("Error: Form not found");
                return;
            }
            
            const formData = new FormData(form);
            
            const submitBtn = document.querySelector('#modal-footer button[type="submit"]');
            if (submitBtn) {
                submitBtn.innerText = 'Saving...';
                submitBtn.disabled = true;
            }

            try {
                const res = await fetch('/notes/new', { 
                    method: 'POST', 
                    body: formData 
                });
                
                if (res.ok) {
                    closeModal();
                    window.location.href = '/notes';
                } else {
                    const errorText = await res.text();
                    alert("Error: " + errorText);
                    if (submitBtn) {
                        submitBtn.innerText = 'Submit Note';
                        submitBtn.disabled = false;
                    }
                }
            } catch (error) {
                alert("Error creating note: " + error.message);
                if (submitBtn) {
                    submitBtn.innerText = 'Submit Note';
                    submitBtn.disabled = false;
                }
            }
        }

        // --- New Output Modal ---
        function openNewOutputModal() {
            const body = `
                <form id="new-output-form" onsubmit="submitNewOutput(event)">
                    <textarea name="topic_query" placeholder="e.g. What have I learned about FATCA compliance?" required 
                        style="width: 100%; min-height: 150px; padding: 12px; font-size: 15px; border: 1px solid var(--border-color); border-radius: 6px; resize: vertical; font-family: inherit; margin-bottom: 16px;"></textarea>
                    
                    <select name="output_type" style="width: 100%; padding: 12px; font-size: 15px; border: 1px solid var(--border-color); border-radius: 6px; background: white; font-family: inherit;">
                        <option value="qna">Q&A Document</option>
                        <option value="narration">Narration Script</option>
                        <option value="summary">Topic Summary</option>
                    </select>
                </form>
            `;
            const footer = `
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" form="new-output-form" class="btn">Generate</button>
            `;
            openModal('New Output', body, footer);
        }

        async function submitNewOutput(event) {
            event.preventDefault();
            
            const form = document.getElementById('new-output-form');
            if (!form) return;
            
            const formData = new FormData(form);
            
            const submitBtn = document.querySelector('#modal-footer button[type="submit"]');
            if (submitBtn) {
                submitBtn.innerText = 'Generating...';
                submitBtn.disabled = true;
            }

            try {
                const res = await fetch('/outputs/new', { 
                    method: 'POST', 
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    closeModal();
                    window.location.href = '/outputs';
                } else {
                    const errorData = await res.json().catch(() => ({}));
                    const errorText = errorData.error || await res.text();
                    alert("Server error: " + errorText);
                    if (submitBtn) {
                        submitBtn.innerText = 'Generate';
                        submitBtn.disabled = false;
                    }
                }
            } catch (error) {
                alert("Error: " + error.message);
                if (submitBtn) {
                    submitBtn.innerText = 'Generate';
                    submitBtn.disabled = false;
                }
            }
        }

        // Event delegation for note links in outputs
        document.addEventListener('click', function(e) {
            if (e.target.matches('[data-note-link]')) {
                e.preventDefault();
                const noteId = e.target.getAttribute('data-note-link');
                loadNoteDetails(noteId);
            }
        });

    </script>

</body>
</html>
