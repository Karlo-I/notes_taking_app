<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notes App{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <aside class="sidebar">
        <h2>My Knowledge Base</h2>
        <a href="/notes" {% if request.path.startswith('/notes') %}class="active"{% endif %}>📝 Notes</a>
        <a href="/outputs" {% if request.path.startswith('/outputs') %}class="active"{% endif %}>✨ Outputs</a>
        <a href="/notes/search">🔍 Search</a>
        
        {% if session.get('user_id') %}
            <div style="margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border-color);">
                <a href="/logout" style="color: var(--danger);">Log out</a>
            </div>
        {% endif %}
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Modal Container -->
    <div id="global-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" style="margin:0; font-size: 16px; font-weight: 600;">Details</h3>
                <button class="close-btn" onclick="closeModal()" style="background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <script>
        function openModal(title, bodyHtml, footerHtml) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerHtml;
            document.getElementById('global-modal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('global-modal').classList.remove('active');
        }
        document.getElementById('global-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        async function loadNoteDetails(id) {
            try {
                const res = await fetch(`/notes/${id}?format=json`);
                if (!res.ok) throw new Error("Server returned " + res.status);
                const data = await res.json();
                
                const body = '<div style="white-space: pre-wrap; font-size: 15px; line-height: 1.6;">' + data.content + '</div>';
                
                let footer = '';
                
                // 1. Delete Button (Left aligned)
                footer += `
                    <form method="post" action="/notes/${data.id}/delete" style="margin-right: auto;">
                        <button type="submit" class="btn" style="background: var(--danger); color: white;">Delete</button>
                    </form>
                `;

                // 2. Action Buttons (Right aligned)
                if (data.status === 'under_review') {
                    footer += `<a href="/notes/${data.id}/review" class="btn">Continue Review</a>`;
                }

                openModal(`[${data.type.toUpperCase()}] ${data.status.replace('_', ' ')}`, body, footer);
            } catch (error) {
                alert("ERROR: " + error.message);
            }
        }

        async function loadOutputDetails(id) {
            try {
                const res = await fetch(`/outputs/${id}?format=json`);
                if (!res.ok) throw new Error("Server returned " + res.status);
                const data = await res.json();
                
                const body = '<div style="white-space: pre-wrap; font-family: serif; line-height: 1.6;">' + data.content + '</div>';
                
                let footer = '';

                // 1. Delete Button (Left aligned)
                footer += `
                    <form method="post" action="/outputs/${data.id}/delete" style="margin-right: auto;">
                        <button type="submit" class="btn" style="background: var(--danger); color: white;">Delete</button>
                    </form>
                `;

                // 2. Regenerate Button (Right aligned)
                footer += `
                    <form method="post" action="/outputs/${data.id}/regenerate" style="display:inline;">
                        <button type="submit" class="btn btn-secondary">Regenerate</button>
                    </form>
                `;

                openModal(`${data.type.toUpperCase()} • ${data.topic || 'Untitled'}`, body, footer);
            } catch (error) {
                alert("ERROR: " + error.message);
            }
        }

        // --- New Note Modal ---
        function openNewNoteModal() {
            const body = `
                <form id="new-note-form" onsubmit="submitNewNote(event)">
                    <textarea name="content" placeholder="Write your note..." required 
                        style="width: 100%; min-height: 150px; padding: 12px; font-size: 15px; border: 1px solid var(--border-color); border-radius: 6px; resize: vertical; font-family: inherit;"></textarea>
                </form>
            `;
            const footer = `
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" form="new-note-form" class="btn">Submit Note</button>
            `;
            openModal('New Note', body, footer);
        }

        async function submitNewNote(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            try {
                const res = await fetch('/notes/new', { method: 'POST', body: formData });
                if (res.ok) {
                    closeModal();
                    window.location.reload(); // Refresh list to show new note
                } else {
                    alert("Error creating note. Please check your input.");
                }
            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        // --- New Output Modal ---
        function openNewOutputModal() {
            const body = `
                <form id="new-output-form" onsubmit="submitNewOutput(event)">
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px;">Topic or question:</label>
                        <textarea name="topic_query" placeholder="e.g. What have I learned about FATCA compliance?" required 
                            style="width: 100%; min-height: 100px; padding: 12px; font-size: 15px; border: 1px solid var(--border-color); border-radius: 6px; resize: vertical; font-family: inherit;"></textarea>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px;">Output type:</label>
                        <select name="output_type" style="width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--border-color); border-radius: 6px; background: white;">
                            <option value="qna">Q&A Document</option>
                            <option value="narration">Narration Script</option>
                            <option value="summary">Topic Summary</option>
                        </select>
                    </div>
                </form>
            `;
            const footer = `
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" form="new-output-form" class="btn">Generate</button>
            `;
            openModal('New Output', body, footer);
        }

        async function submitNewOutput(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            
            // Prevent double-clicks while generating
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'Generating...';
            submitBtn.disabled = true;

            try {
                const res = await fetch('/outputs/new', { method: 'POST', body: formData });
                if (res.ok) {
                    closeModal();
                    window.location.reload(); // Refresh list to show new output
                } else {
                    alert("Error creating output. Please check your input.");
                    submitBtn.innerText = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                alert("Error: " + error.message);
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        }

    </script>

</body>
</html>
