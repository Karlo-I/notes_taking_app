{% extends "base.html" %}

{% block title %}Analytics Dashboard{% endblock %}

{% block content %}
<!-- This is where React will mount -->
<div id="root" style="width: 100%; padding: 20px; box-sizing: border-box;"></div>

<!-- Load the React CSS and JS dynamically -->
{% if css_href %}
    <link rel="stylesheet" href="{{ css_href }}">
{% endif %}

{% if script_src %}
    <script type="module" src="{{ script_src }}"></script>
{% endif %}
{% endblock %}
